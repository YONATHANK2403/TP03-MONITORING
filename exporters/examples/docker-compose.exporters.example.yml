# EXEMPLES d'exporters à ajouter pour superviser les services applicatifs.
# Copier le bloc voulu dans docker-compose.yml, puis déclarer le scrape dans
# prometheus/prometheus.yml (voir exporters/README.md).
services:
  # Métriques Nginx (nécessite stub_status activé côté Nginx)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    command: ["--nginx.scrape-uri=http://demo-web:80/stub_status"]
    networks: [monitoring]

  # Métriques Redis
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment: { REDIS_ADDR: "redis://demo-redis:6379" }
    networks: [monitoring]

  # Métriques PostgreSQL
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@ma-base:5432/db?sslmode=disable"
    networks: [monitoring]

  # Métriques MySQL / MariaDB
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    environment: { DATA_SOURCE_NAME: "user:password@(ma-base:3306)/" }
    networks: [monitoring]

networks:
  monitoring:
    external: true
    name: monitoring
