apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus            # référencé par tous les dashboards
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s        # = scrape_interval Prometheus (pour $__rate_interval)
